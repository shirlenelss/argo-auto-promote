# Shared HTTP gateway for the "sample" system, bound to the istio-ingressgateway
# installed by repo/istio/. Hosts are wildcarded here; each VirtualService
# claims its own hostname (set per-env via overlay patches).
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: sample-gateway
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "*"
