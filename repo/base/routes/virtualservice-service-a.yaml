# Host is a placeholder; overlays patch spec.hosts[0] to the env-specific URL.
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: service-a
spec:
  hosts:
    - service-a.PLACEHOLDER
  gateways:
    - sample-gateway
  http:
    - route:
        - destination:
            host: service-a
            port:
              number: 80
