apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b-app
  labels:
    app: service-b-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b-app
  template:
    metadata:
      labels:
        app: service-b-app
    spec:
      containers:
        - name: service-b-app
          image: nginx:1.25.0
          ports:
            - containerPort: 80
          env:
            # nginx's docker-entrypoint envsubst's *.template files in
            # /etc/nginx/templates using every env var visible here, writing
            # the result to NGINX_ENVSUBST_OUTPUT_DIR. IMAGE_TAG's value is
            # overwritten per overlay by a `replacements` block that reads
            # it back off this same container's own (already-promoted)
            # image field, so it never needs to be set by hand.
            - name: ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: IMAGE_TAG
              value: unset
            - name: NGINX_ENVSUBST_OUTPUT_DIR
              value: /usr/share/nginx/html
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          volumeMounts:
            - name: html-template
              mountPath: /etc/nginx/templates
      volumes:
        - name: html-template
          configMap:
            name: service-b-app-html
