apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-b-app
  labels:
    app: service-b-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-b-app
  template:
    metadata:
      labels:
        app: service-b-app
    spec:
      containers:
        - name: service-b-app
          image: service-b:0.0.1
          ports:
            - containerPort: 8080
          env:
            # IMAGE_TAG's value is overwritten per overlay by a
            # `replacements` block that reads it back off this same
            # container's own (already-promoted) image field, so it
            # never needs to be set by hand.
            - name: ENVIRONMENT
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: IMAGE_TAG
              value: unset
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
