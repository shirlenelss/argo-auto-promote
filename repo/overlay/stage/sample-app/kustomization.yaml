apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: sample-app-stage

resources:
- ../../../base/sample-app

images:
- name: nginx
  newName: nginx
  newTag: 1.27.0

patches:
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: sample-app
