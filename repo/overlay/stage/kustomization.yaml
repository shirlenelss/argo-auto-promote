apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Whole "sample" system (all apps) for the stage environment.
namespace: sample-stage

resources:
  - ../../base/sample-app
  - ../../base/service-b
  - ../../base/routes

images:
  - name: nginx
    newTag: "1.27.0"

# Project each Deployment's own (already-promoted) image tag into its
# IMAGE_TAG env var, so the served page can display it without the tag
# being hand-maintained in a second place. Must live in the same file as
# `images:` above -- it reads the post-image-transform value.
replacements:
  - source:
      kind: Deployment
      name: sample-app
      fieldPath: spec.template.spec.containers.[name=sample-app].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: sample-app
        fieldPaths:
          - spec.template.spec.containers.[name=sample-app].env.[name=IMAGE_TAG].value
  - source:
      kind: Deployment
      name: service-b-app
      fieldPath: spec.template.spec.containers.[name=service-b-app].image
      options:
        delimiter: ":"
        index: 1
    targets:
      - select:
          kind: Deployment
          name: service-b-app
        fieldPaths:
          - spec.template.spec.containers.[name=service-b-app].env.[name=IMAGE_TAG].value

# Each VirtualService gets two hosts: a nip.io one (no real DNS needed) and a
# real one on the shared "apps.shirlenelim.se" wildcard, so a single DNS
# record (*.apps.shirlenelim.se -> ingress gateway IP) covers every app/env
# combination without creating per-app subdomains by hand.
patches:
  - target:
      kind: VirtualService
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: sample-app.stage.127.0.0.1.nip.io
      - op: add
        path: /spec/hosts/-
        value: sample-app-stage.apps.shirlenelim.se
  - target:
      kind: VirtualService
      name: service-b
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: service-b.stage.127.0.0.1.nip.io
      - op: add
        path: /spec/hosts/-
        value: service-b-stage.apps.shirlenelim.se
