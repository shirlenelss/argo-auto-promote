apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Whole "sample" system (all apps) for the stage environment.
namespace: sample-stage

resources:
  - ../../base/sample-app
  - ../../base/service-b
  - ../../base/routes

images:
  - name: nginx
    newTag: "1.27.0"

# nip.io resolves without real DNS, against the istio-ingressgateway's IP.
# Swap 127.0.0.1 for that IP (`kubectl -n istio-system get svc istio-ingressgateway`).
patches:
  - target:
      kind: VirtualService
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: sample-app.stage.127.0.0.1.nip.io
  - target:
      kind: VirtualService
      name: service-b
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: service-b.stage.127.0.0.1.nip.io
