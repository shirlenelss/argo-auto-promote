apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Whole "sample" system (all apps) for the stage environment.
namespace: sample-stage

resources:
  - ../../base/sample-app
  - ../../base/service-b
  - ../../base/routes

images:
  - name: nginx
    newTag: "1.27.0"

# Each VirtualService gets two hosts: a nip.io one (no real DNS needed) and a
# real one on the shared "apps.shirlenelim.se" wildcard, so a single DNS
# record (*.apps.shirlenelim.se -> ingress gateway IP) covers every app/env
# combination without creating per-app subdomains by hand.
patches:
  - target:
      kind: VirtualService
      name: sample-app
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: sample-app.stage.127.0.0.1.nip.io
      - op: add
        path: /spec/hosts/-
        value: sample-app-stage.apps.shirlenelim.se
  - target:
      kind: VirtualService
      name: service-b
    patch: |-
      - op: replace
        path: /spec/hosts/0
        value: service-b.stage.127.0.0.1.nip.io
      - op: add
        path: /spec/hosts/-
        value: service-b-stage.apps.shirlenelim.se
