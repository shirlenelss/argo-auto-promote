apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Whole "sample" system (all apps) for the dev environment.
namespace: sample-dev

resources:
- ../../base/service-a
- ../../base/service-b
- ../../base/routes

# service-a and service-b are separate images now, but promote.sh still
# pins both to the same tag value here (system-level promotion). Give
# them independently-set tags below to promote them separately.
images:
- name: service-a
  newTag: "0.0.1"
- name: service-b
  newTag: "0.0.1"

# Project each Deployment's own (already-promoted) image tag into its
# IMAGE_TAG env var, so the served page can display it without the tag
# being hand-maintained in a second place. Must live in the same file as
# `images:` above -- it reads the post-image-transform value.
replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=service-a-app].image
    kind: Deployment
    name: service-a-app
    options:
      delimiter: ':'
      index: 1
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=service-a-app].env.[name=IMAGE_TAG].value
    select:
      kind: Deployment
      name: service-a-app
- source:
    fieldPath: spec.template.spec.containers.[name=service-b-app].image
    kind: Deployment
    name: service-b-app
    options:
      delimiter: ':'
      index: 1
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=service-b-app].env.[name=IMAGE_TAG].value
    select:
      kind: Deployment
      name: service-b-app

# Each VirtualService gets two hosts: a nip.io one (no real DNS needed) and a
# real one on the shared "apps.shirlenelim.se" wildcard, so a single DNS
# record (*.apps.shirlenelim.se -> ingress gateway IP) covers every app/env
# combination without creating per-app subdomains by hand.
patches:
- patch: |-
    - op: replace
      path: /spec/hosts/0
      value: service-a.dev.127.0.0.1.nip.io
    - op: add
      path: /spec/hosts/-
      value: service-a-dev.apps.shirlenelim.se
  target:
    kind: VirtualService
    name: service-a
- patch: |-
    - op: replace
      path: /spec/hosts/0
      value: service-b.dev.127.0.0.1.nip.io
    - op: add
      path: /spec/hosts/-
      value: service-b-dev.apps.shirlenelim.se
  target:
    kind: VirtualService
    name: service-b
