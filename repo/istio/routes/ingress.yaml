# Fronts istio-ingressgateway with Traefik (already the cluster's ingress
# controller) for the real apps.shirlenelim.se hostnames. Traefik forwards
# by Host header to the gateway's ClusterIP; Istio's own VirtualServices
# (repo/base/routes) then route by that same Host to the right app.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sample-routes
  namespace: istio-system
spec:
  ingressClassName: traefik
  rules:
    - host: sample-app-dev.apps.shirlenelim.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: istio-ingressgateway
                port:
                  number: 80
    - host: service-b-dev.apps.shirlenelim.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: istio-ingressgateway
                port:
                  number: 80
    - host: sample-app-stage.apps.shirlenelim.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: istio-ingressgateway
                port:
                  number: 80
    - host: service-b-stage.apps.shirlenelim.se
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: istio-ingressgateway
                port:
                  number: 80
