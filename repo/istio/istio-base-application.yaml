# Istio CRDs. Installed first (sync-wave 0) so istiod can register its
# CustomResourceDefinitions before the control plane comes up.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-base
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    targetRevision: 1.30.3
    helm:
      releaseName: istio-base
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # istiod's webhook controller patches this at runtime once it's ready: it
  # fills in clientConfig.caBundle and flips failurePolicy from the chart's
  # "Ignore" default to "Fail". Both always differ from the rendered chart,
  # so selfHeal would otherwise fight istiod over them forever.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/0/failurePolicy
