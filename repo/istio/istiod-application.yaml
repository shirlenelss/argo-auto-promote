# Istio control plane. Depends on the CRDs from istio-base, so it syncs
# after it (sync-wave 1).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istiod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    targetRevision: 1.30.3
    helm:
      releaseName: istiod
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  # istiod's webhook controller patches this at runtime once it's ready: it
  # fills in clientConfig.caBundle and flips failurePolicy from the chart's
  # "Ignore" default to "Fail". Both always differ from the rendered chart,
  # so selfHeal would otherwise fight istiod over them forever.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jsonPointers:
        - /webhooks/0/clientConfig/caBundle
        - /webhooks/0/failurePolicy
