apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: service-a
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
          - env: stage
          - env: sandbox
          - env: prod
  template:
    metadata:
      name: "service-a-{{env}}"
      namespace: argocd
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/shirlenelss/argo-auto-promote.git
        targetRevision: main
        path: "repo/overlay/{{env}}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "sample-{{env}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
