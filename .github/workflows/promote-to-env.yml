name: Promote to Stage

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to promote to (stage, sandbox, prod)"
        required: true
      image_tag:
        description: "Image tag to promote"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate environment
        run: |
          ENV="${{ github.event.inputs.environment }}"
          if [[ ! "$ENV" =~ ^(stage|sandbox|prod)$ ]]; then
            echo "Invalid environment: $ENV"
            exit 1
          fi

      - name: Update image tag
        run: |
          TAG="${{ github.event.inputs.image_tag }}"
          ENV="${{ github.event.inputs.environment }}"
          FILE="repo/overlay/${ENV}/kustomization.yaml"

          # Replace the newTag value
          sed -i "s|newTag:.*|newTag: \"${TAG}\"|" "$FILE"

          echo "Updated $FILE to tag: $TAG"
          cat "$FILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          ENV="${{ github.event.inputs.environment }}"
          git add repo/overlay/${ENV}/kustomization.yaml
          git commit -m "promote: $ENV image tag -> ${{ github.event.inputs.image_tag }} [${{ steps.semver.outputs.bump }}]"
          git push
