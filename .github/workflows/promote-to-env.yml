name: Promote to environment

# Gated GitOps promotion: the tag is NOT entered by hand. It is read from the
# previous environment's values file and copied forward, so an env can only
# ever receive a tag that already ran in the env before it:
#   dev --> stage --> prod        (sandbox promotes from dev, as a side env)
# The build/CI pipeline is what pins dev; this workflow promotes onward.
# Promotion is per-service (chart/services/<service>/<env>.yaml) -- each
# service promotes independently.

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Service to promote"
        required: true
        type: choice
        options:
          - service-a
          - service-b
      environment:
        description: "Target environment to promote to"
        required: true
        type: choice
        options:
          - stage
          - sandbox
          - prod

jobs:
  promote:
    runs-on: ubuntu-latest
    # Uses GitHub Environment protection rules if configured (e.g. require a
    # reviewer for 'prod'). Auto-created without protection if not set up.
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve source environment
        id: resolve
        run: |
          TARGET="${{ github.event.inputs.environment }}"
          case "$TARGET" in
            stage)   SOURCE="dev"   ;;
            prod)    SOURCE="stage" ;;
            sandbox) SOURCE="dev"   ;;
            *) echo "::error::Unknown target environment: $TARGET"; exit 1 ;;
          esac
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "Promotion path: $SOURCE -> $TARGET"

      - name: Read tag from source values file
        id: tag
        run: |
          SERVICE="${{ github.event.inputs.service }}"
          SOURCE="${{ steps.resolve.outputs.source }}"
          SRC_FILE="chart/services/${SERVICE}/${SOURCE}.yaml"
          if [[ ! -f "$SRC_FILE" ]]; then
            echo "::error::Source values file not found: $SRC_FILE"; exit 1
          fi
          TAG="$(grep 'tag:' "$SRC_FILE" | head -1 | awk '{print $2}' | tr -d '"')"
          if [[ -z "$TAG" ]]; then
            echo "::error::No tag found in $SRC_FILE"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag to promote (from $SOURCE): $TAG"

      - name: Update target values file
        id: update
        run: |
          SERVICE="${{ github.event.inputs.service }}"
          TARGET="${{ github.event.inputs.environment }}"
          TAG="${{ steps.tag.outputs.tag }}"
          DST_FILE="chart/services/${SERVICE}/${TARGET}.yaml"
          if [[ ! -f "$DST_FILE" ]]; then
            echo "::error::Target values file not found: $DST_FILE"; exit 1
          fi

          CURRENT="$(grep 'tag:' "$DST_FILE" | head -1 | awk '{print $2}' | tr -d '"')"
          if [[ "$CURRENT" == "$TAG" ]]; then
            echo "Target $SERVICE/$TARGET is already on $TAG — nothing to promote."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sed -i "s|tag:.*|tag: \"${TAG}\"|" "$DST_FILE"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Updated $DST_FILE: $CURRENT -> $TAG"
          cat "$DST_FILE"

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        run: |
          SERVICE="${{ github.event.inputs.service }}"
          TARGET="${{ github.event.inputs.environment }}"
          SOURCE="${{ steps.resolve.outputs.source }}"
          TAG="${{ steps.tag.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "chart/services/${SERVICE}/${TARGET}.yaml"
          git commit -m "promote: ${SERVICE} ${SOURCE} -> ${TARGET} image tag -> ${TAG}"
          git push
